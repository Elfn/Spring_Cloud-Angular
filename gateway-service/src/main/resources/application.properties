spring.application.name=gateway-service
server.port=5555

# Datasource
#spring.datasource.url=jdbc:mysql://localhost:3306/gwdb?useUnicode=true&useLegacyDatetimeCode=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
